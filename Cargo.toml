[package]
name = "typst-doc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
description = "Render R, Python, Typst, and man page documentation as Typst"
readme = "README.md"
keywords = ["r", "rd", "python", "man", "typst"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

# R reader
rd-ast = { version = "0.3.1", default-features = false }
rd-source = "0.3.1"

# Python reader
pydocstring = "0.4.1"
rustpython-parser = "0.4.0"
html-escape = "0.2.15"

# Typst reader; also validates that generated documents parse as well-formed
# Typst (tests and the validate example).
typst-syntax = "0.15.1"

[[example]]
name = "validate"
required-features = []

[dev-dependencies]
clap_mangen = "0.3.3"
