[package]
name = "typst-doc"
version = "0.0.3"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
description = "Render R, Python, Typst, and man page documentation as Typst"
readme = "README.md"
keywords = ["r", "rd", "python", "man", "typst"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
repository = "https://github.com/vincentarelbundock/typst-doc"
homepage = "https://vincentarelbundock.github.io/typst-doc/"
documentation = "https://vincentarelbundock.github.io/typst-doc/reference.html"
# The built website and its sources are for the repository, not for the crate.
exclude = ["docs/", "docs-src/", ".github/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

# R reader
rd-ast = { version = "0.3.1", default-features = false }
rd-source = "0.3.1"

# Python reader
pydocstring = "0.4.1"
rustpython-parser = "0.4.0"
html-escape = "0.2.15"

# Typst reader; also validates that generated documents parse as well-formed
# Typst (tests and the validate example).
typst-syntax = "0.15.1"

[[example]]
name = "validate"
required-features = []

[dev-dependencies]
clap_mangen = "0.3.3"

# cargo-dist uses this profile for release builds
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (required)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Target platforms to build for
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Installers to generate
installers = ["shell", "powershell"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true
# Whether to auto-include files like README/LICENSE/CHANGELOG
auto-includes = true
# Only plan (don't build) on pull requests
pr-run-mode = "plan"
# Enable GitHub Attestations for provenance
github-attestations = true
